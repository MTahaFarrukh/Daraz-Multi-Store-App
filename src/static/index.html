<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MultiStore — Daraz Label Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=5" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="top">
    <div class="brand-block">
      <p class="brand">MultiStore</p>
      <p class="tagline">Daraz Pakistan · multi-store label desk</p>
    </div>
    <div class="top-actions">
      <a class="btn btn-ghost" href="/oauth/login">Connect store</a>
      <button type="button" class="btn btn-primary" id="btn-refresh" disabled>Refresh tokens</button>
    </div>
  </header>

  <main class="shell">
    <section class="panel stores-panel" aria-labelledby="stores-heading">
      <div class="panel-head">
        <h2 id="stores-heading">My stores</h2>
        <span class="meta" id="store-count">Loading…</span>
      </div>
      <div class="store-toolbar">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-select-all">All</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-select-none">None</button>
        <span class="meta" id="store-selection-meta">0 selected</span>
      </div>
      <div class="store-list" id="store-list" role="group" aria-label="Store selection"></div>
      <div class="store-profiles">
        <label class="profile-field">
          <span>Saved profile</span>
          <select id="profile-select">
            <option value="">— Custom selection —</option>
          </select>
        </label>
        <div class="profile-actions">
          <input type="text" id="profile-name" placeholder="e.g. Vendor Ali" maxlength="40" />
          <button type="button" class="btn btn-ghost btn-sm" id="btn-save-profile">Save profile</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-delete-profile">Delete</button>
        </div>
      </div>
    </section>

    <section class="panel controls-panel" aria-labelledby="controls-heading">
      <div class="panel-head">
        <h2 id="controls-heading">Ready to ship</h2>
      </div>
      <form class="controls" id="controls-form">
        <label>
          <span>Limit</span>
          <select id="limit-select">
            <option value="3">3 (fast)</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </label>
        <div class="control-actions">
          <button type="submit" class="btn btn-primary" id="btn-load">Load orders</button>
          <button type="button" class="btn btn-accent" id="btn-print">Print labels PDF</button>
          <a class="btn btn-ghost hidden" id="btn-download" href="/api/download/combined-labels" target="_blank" rel="noopener">Download PDF</a>
        </div>
      </form>
    </section>

    <section class="panel label-sources-panel hidden" id="label-sources-panel" aria-labelledby="label-sources-heading">
      <div class="panel-head">
        <h2 id="label-sources-heading">Last print</h2>
        <span class="meta" id="label-sources-meta"></span>
      </div>
      <div class="table-wrap">
        <table class="orders-table label-sources-table" id="label-sources-table">
          <thead>
            <tr>
              <th>Store</th>
              <th>Order ID</th>
            </tr>
          </thead>
          <tbody id="label-sources-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel orders-panel" aria-labelledby="orders-heading">
      <div class="panel-head">
        <h2 id="orders-heading">Orders</h2>
        <span class="meta" id="orders-meta">No orders loaded yet</span>
      </div>
      <div class="table-wrap">
        <table class="orders-table" id="orders-table">
          <thead>
            <tr>
              <th>Store</th>
              <th>Order ID</th>
              <th>Items</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr class="empty-row">
              <td colspan="5">Connect a store, then load ready-to-ship orders.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <div class="busy hidden" id="busy" aria-hidden="true">
    <div class="busy-card">
      <div class="spinner"></div>
      <p id="busy-text">Working…</p>
    </div>
  </div>

  <script src="/static/app.js?v=5"></script>
</body>
</html>
